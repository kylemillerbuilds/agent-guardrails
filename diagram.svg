<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 500" width="940" height="500" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#111c33"/>
      <stop offset="1" stop-color="#0a1120"/>
    </linearGradient>
    <radialGradient id="panelglow" cx="0.22" cy="0.3" r="0.9">
      <stop offset="0" stop-color="#1b2a4a" stop-opacity="0.7"/>
      <stop offset="1" stop-color="#0a1120" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1e2c4c"/>
      <stop offset="1" stop-color="#16203a"/>
    </linearGradient>
    <linearGradient id="cardDanger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a2230"/>
      <stop offset="1" stop-color="#2a1824"/>
    </linearGradient>
    <linearGradient id="cardSafe" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#16322c"/>
      <stop offset="1" stop-color="#102621"/>
    </linearGradient>
    <linearGradient id="shield" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a3e63"/>
      <stop offset="1" stop-color="#1b2942"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="180%">
      <feDropShadow dx="0" dy="9" stdDeviation="11" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="5.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs><rect x="1" y="1" width="938" height="498" rx="26" fill="url(#panel)"/><rect x="1" y="1" width="938" height="498" rx="26" fill="url(#panelglow)"/><rect x="1.5" y="1.5" width="937" height="497" rx="25.5" fill="none" stroke="#ffffff" stroke-opacity="0.07"/><text x="42" y="54" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="25" font-weight="700" fill="#eef3fb" letter-spacing="0.2">agent-guardrails</text><text x="42" y="78" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14.5" fill="#98a6bc">How every command is judged, before it runs</text><g filter="url(#shadow)"><rect x="40" y="206" width="176" height="92" rx="18" fill="url(#card)"/></g><rect x="40" y="206" width="176" height="92" rx="18" fill="none" stroke="#ffffff" stroke-opacity="0.10"/><text x="64" y="240" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#6f7d93" text-anchor="start" letter-spacing="1.6">AI AGENT</text><text x="64" y="266" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#eef3fb" text-anchor="start" letter-spacing="0">bash command</text><g filter="url(#glow)"><path d="M 430 196.0 L 482.0 222.0 L 482.0 270.0 Q 482.0 288.0 430 316.0 Q 378.0 288.0 378.0 270.0 L 378.0 222.0 Z" fill="url(#shield)" stroke="#5cc7ff" stroke-width="2.6" stroke-opacity="0.95"/></g><path d="M 413.0 252 L 425.0 264.0 L 449.0 238.0" fill="none" stroke="#5cc7ff" stroke-width="4.2" stroke-linecap="round" stroke-linejoin="round"/><text x="430" y="340.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#eef3fb" text-anchor="middle">guard.sh</text><text x="430" y="358.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" fill="#98a6bc" text-anchor="middle">PreToolUse hook</text><path d="M 216 252 C 294.0 252, 294.0 252, 363 252" fill="none" stroke="#98a6bc" stroke-opacity="0.55" stroke-width="2.2" stroke-linecap="round"/><path d="M 363 247 L 372 252 L 363 257 Z" fill="#98a6bc" fill-opacity="0.8"/><g filter="url(#shadow)"><rect x="612" y="84" width="292" height="176" rx="18" fill="url(#cardDanger)"/></g><rect x="612" y="84" width="292" height="176" rx="18" fill="none" stroke="#ffffff" stroke-opacity="0.10"/><rect x="612" y="98" width="4" height="148" rx="2" fill="#ff6f76"/><rect x="636" y="104" width="93" height="28" rx="14" fill="#ff6f76" fill-opacity="0.16" stroke="#ff6f76" stroke-opacity="0.55"/><text x="682" y="123" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#ff6f76" text-anchor="middle" letter-spacing="0.6">BLOCKED</text><rect x="636" y="148" width="250" height="30" rx="15.0" fill="#ffffff" fill-opacity="0.05" stroke="#ffffff" stroke-opacity="0.11"/><circle cx="652" cy="163.0" r="3.2" fill="#ff6f76"/><text x="666" y="167.5" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="500" fill="#eef3fb">git worktree or new branch</text><rect x="636" y="186" width="250" height="30" rx="15.0" fill="#ffffff" fill-opacity="0.05" stroke="#ffffff" stroke-opacity="0.11"/><circle cx="652" cy="201.0" r="3.2" fill="#ff6f76"/><text x="666" y="205.5" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="500" fill="#eef3fb">git add -A  ·  commit -a</text><rect x="636" y="224" width="250" height="30" rx="15.0" fill="#ffffff" fill-opacity="0.05" stroke="#ffffff" stroke-opacity="0.11"/><circle cx="652" cy="239.0" r="3.2" fill="#ff6f76"/><text x="666" y="243.5" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="500" fill="#eef3fb">rm or mv in protected dirs</text><g filter="url(#shadow)"><rect x="612" y="304" width="292" height="96" rx="18" fill="url(#cardSafe)"/></g><rect x="612" y="304" width="292" height="96" rx="18" fill="none" stroke="#ffffff" stroke-opacity="0.10"/><rect x="612" y="318" width="4" height="68" rx="2" fill="#57e0a6"/><rect x="636" y="324" width="93" height="28" rx="14" fill="#57e0a6" fill-opacity="0.16" stroke="#57e0a6" stroke-opacity="0.55"/><text x="682" y="343" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#57e0a6" text-anchor="middle" letter-spacing="0.6">ALLOWED</text><text x="636" y="372" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14.5" font-weight="500" fill="#98a6bc" text-anchor="start" letter-spacing="0">everything else, by default</text><path d="M 486 224 C 549.0 224, 549.0 150, 603 150" fill="none" stroke="#ff6f76" stroke-opacity="0.55" stroke-width="2.2" stroke-linecap="round"/><path d="M 603 145 L 612 150 L 603 155 Z" fill="#ff6f76" fill-opacity="0.8"/><path d="M 486 280 C 549.0 280, 549.0 350, 603 350" fill="none" stroke="#57e0a6" stroke-opacity="0.55" stroke-width="2.2" stroke-linecap="round"/><path d="M 603 345 L 612 350 L 603 355 Z" fill="#57e0a6" fill-opacity="0.8"/><rect x="322" y="372" width="216" height="30" rx="15.0" fill="#ffffff" fill-opacity="0.05" stroke="#ffffff" stroke-opacity="0.11"/><circle cx="338" cy="387.0" r="3.2" fill="#f3c668"/><text x="352" y="391.5" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="500" fill="#eef3fb">also warns:  launchctl load</text><text x="42" y="470" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="500" fill="#6f7d93" text-anchor="start" letter-spacing="0">Fail-open by design. Any parse error or unmatched input is allowed; it only ever blocks explicit, matched danger.</text></svg>